<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clues preview (fake network)</title>
<link rel="stylesheet" href="../clue/style.css"><link rel="stylesheet" href="../clue/play.css"></head>
<body>
<header><span class="hside"><button id="players-btn" class="ib" data-act="players" aria-label="Players" hidden><svg viewBox="0 0 20 20" width="20" height="20"><path d="M7 5h10M7 10h10M7 15h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="3" cy="5" r="1.4" fill="currentColor"/><circle cx="3" cy="10" r="1.4" fill="currentColor"/><circle cx="3" cy="15" r="1.4" fill="currentColor"/></svg></button></span><h1>Clues</h1><span class="hside"><span id="code-pill" class="pill" hidden></span></span></header>
<main><div id="view"></div><p id="msg" class="warn center" role="status"></p></main>
<script src="../clue/portraits.js"></script><script src="../clue/solver.js"></script>
<script type="module">
// Local preview without Firebase: ?step=home|lobby|turn|players|asked|watch|result|end (end: add &t=seconds to freeze the finale at that moment)  (bots: Sir, Bebun, Dada)
import { startApp } from '../clue/app.js';
import { FakeDb } from './fake-net.js';
const qs = new URLSearchParams(location.search), step = qs.get('step') || 'turn', reveal = qs.get('t');
const db = new FakeDb(), wait = (ms) => new Promise((r) => setTimeout(r, ms));
startApp({ net: db.client('me'), doc: document, win: window, delays: { bot: step === 'end' ? 0 : step === 'watch' ? 400 : 150, none: 150, reveal: reveal == null ? undefined : +reveal } });
const click = (sel) => { const el = document.querySelector(sel); if (el) el.click(); return !!el; };
(async () => {
  if (step === 'home') return;
  await wait(50);
  const n = document.getElementById('name'); n.value = qs.get('name') || 'Telot'; n.dispatchEvent(new Event('input', { bubbles: true }));
  click('[data-act=create]'); if (step === 'modes') return; click('[data-act=mk][data-m=' + (qs.get('mode') || 'fast') + ']'); await wait(50);
  for (const b of ['Sir', 'Bebun', 'Dada']) { click('[data-act=bot][data-n=' + b + ']'); await wait(20); }
  if (step === 'lobby') return;
  click('[data-act=start]'); await wait(100);
  if (step === 'board') { click('[data-act=roll]'); return; }
  if (step === 'turn' || step === 'players') {
    [0, 1].forEach((k) => click('tr.pk td[data-act=pick][data-k="' + k + '"]'));
    if (step === 'players') { click('.rd.y'); click('#players-btn'); const ps = document.querySelectorAll('[data-act=pexp]'); ps.forEach((b) => b.click()); }
    return;
  }
  for (let i = 0; i < 3000; i++) {
    const g = db.read('rooms/' + document.getElementById('code-pill').textContent.slice(5) + '/game');
    if (step === 'asked' && document.querySelector('.fc.tap') && g.log) return;
    if (step === 'watch' && g.phase === 'answer' && g.cur.by !== 'me' && g.cur.order[g.cur.i] !== 'me') return;
    if (step === 'result' && document.querySelector('[data-act=end]') && g.log.length > 4) return;
    if (g.over) return;
    if (!click('.fc.tap') && !click('[data-act=end]') && document.querySelector('[data-act=suggest]')) {
      [0, 1, 2].forEach((k) => { const o = document.querySelectorAll('[data-act=pick][data-k="' + k + '"]'); o[Math.floor(Math.random() * o.length)].click(); });
      click('[data-act=suggest]');
    }
    await wait(30);
  }
})();
</script></body></html>
