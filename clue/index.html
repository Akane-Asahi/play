<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<title>Clues – play together</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="play.css">
</head>
<body>
<header>
  <span class="hside"><button id="players-btn" class="ib" data-act="players" aria-label="Players" hidden><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="3" cy="5" r="1.4" fill="currentColor"/><circle cx="3" cy="10" r="1.4" fill="currentColor"/><circle cx="3" cy="15" r="1.4" fill="currentColor"/></svg></button></span>
  <h1>Clues</h1>
  <span class="hside"><span id="code-pill" class="pill" hidden></span></span>
</header>
<main>
  <div id="view"><p class="muted center">Loading…</p></div>
  <p id="msg" class="warn center" role="status"></p>
</main>
<!-- three.js for the 3D game mode, only downloaded when a 3D room is played (see main.js) -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
<script src="portraits.js"></script>
<script src="solver.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
