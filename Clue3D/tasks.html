<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100d">
<title>Clues 3D · Task board</title>
<style>
:root{
  --bg:#14100d; --col:#1c1612; --card:#2a221b; --card2:#30271f; --ink:#f1e8da; --mute:#9d9183; --line:#3a2e24;
  --accent:#c19b57; --accent-ink:#1b1408; --you:#e2a35a; --ok:#6fc48f; --shadow:0 12px 34px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit}
header{padding:calc(12px + env(safe-area-inset-top)) 14px 6px;display:flex;flex-direction:column;gap:8px;flex:none}
.top{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 small{color:var(--accent);font-weight:650}
.sync{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.sync.live{color:var(--ok);border-color:#2f4a38}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.bar{flex:1;height:6px;border-radius:9px;background:var(--col);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#e8c47f);border-radius:9px;transition:width .4s}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--mute)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.youf.on{background:var(--you);border-color:var(--you);color:#241608}
.board{flex:1;min-height:0;display:flex;gap:12px;padding:6px 14px calc(14px + env(safe-area-inset-bottom));overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:14px}
.col{flex:0 0 min(86vw,360px);display:flex;flex-direction:column;min-height:0;background:var(--col);border:1px solid var(--line);border-radius:14px;scroll-snap-align:start}
@media (min-width:900px){.board{justify-content:center}.col{flex:1 1 0;max-width:420px}}
.col h2{margin:0;padding:12px 14px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--mute);display:flex;align-items:center;gap:8px}
.col h2 .dot{width:9px;height:9px;border-radius:50%}
.col h2 .n{margin-left:auto;background:var(--card);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink)}
.list{flex:1;min-height:60px;overflow-y:auto;padding:4px 10px 14px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.list.over{background:rgba(193,155,87,.06);border-radius:0 0 14px 14px}
.empty{color:var(--mute);font-size:13px;text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y;transition:transform .12s,box-shadow .12s}
.card:hover{background:var(--card2)}
.card .meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:650;border-radius:6px;padding:2px 7px;color:#1b1408}
.id{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.you{font-size:11px;font-weight:650;color:var(--you);border:1px solid rgba(226,163,90,.5);border-radius:6px;padding:1px 6px}
.card .title{font-weight:600;line-height:1.3}
.card .sub{font-size:12px;color:var(--mute);margin-top:5px;display:flex;gap:10px}
.card.done .title{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(157,145,131,.5)}
.card.ph{opacity:.25;border-style:dashed}
.card.press{transform:scale(.97)}
.ghost{position:fixed;z-index:50;pointer-events:none;margin:0;box-shadow:var(--shadow);transform:rotate(2.5deg) scale(1.03);cursor:grabbing;opacity:.97}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;background:var(--col);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));max-height:82dvh;overflow-y:auto;transform:translateY(105%);transition:transform .22s}
.sheet.on{transform:none}.sheet-bg.on{display:block}
.sheet h3{margin:6px 0 8px;font-size:18px}
.sheet p{margin:6px 0;color:#e2d8c8}
.sheet ul{margin:8px 0;padding-left:20px;color:#e2d8c8}
.sheet li{margin:3px 0}
.note{background:var(--card);border-left:3px solid var(--accent);padding:8px 10px;border-radius:6px;font-size:14px;margin:10px 0}
.moves{display:flex;gap:8px;margin-top:14px}
.moves button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 8px;cursor:pointer;font-weight:600}
.moves button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.close{float:right;border:0;background:var(--card);border-radius:50%;width:34px;height:34px;cursor:pointer;color:var(--mute)}
.hint{font-size:12px;color:var(--mute);text-align:center;padding:0 14px 4px}
</style>
</head>

<script>
(function () {
  const COLS = [
    { id: 'todo', name: 'To do', color: '#9d9183' },
    { id: 'doing', name: 'In progress', color: '#e2a35a' },
    { id: 'done', name: 'Done', color: '#6fc48f' },
  ];
  const PHASE_COLORS = ['#c19b57', '#e7a1b4', '#9fb1dc', '#a8d89a', '#e3a989', '#c9a8d8', '#7fc6b7', '#e5cf8f', '#9fc3a8', '#f0a37a', '#b9c2d0', '#d6b4f0', '#8fd0e0'];
  const TASKS = JSON.parse(document.getElementById('tasks-data').textContent);
  const byId = new Map(TASKS.map((t) => [t.id, t]));
  const phases = [...new Set(TASKS.map((t) => t.phase))];
  const phaseColor = (p) => PHASE_COLORS[phases.indexOf(p) % PHASE_COLORS.length];
  const LS = 'clue3d-taskboard-moves-v1';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // moves: { taskId: { col, order, t, note? } } from this device, or from the shared store when published.
  let moves = {};
  try { moves = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { moves = {}; }
  let db = null;
  const filter = { phase: null, you: false };

  // Where a task is now: the newest of the file's status and any move.
  function place(t) {
    const m = moves[t.id];
    if (m && COLS.some((c) => c.id === m.col) && (m.t || 0) > (t.t || 0)) return { col: m.col, order: m.order, note: m.note || t.note };
    return { col: t.status || 'todo', order: t.order, note: t.note };
  }

  function render() {
    const board = $('board'), keepScroll = {};
    board.querySelectorAll('.list').forEach((l) => { keepScroll[l.dataset.col] = l.scrollTop; });
    const done = TASKS.filter((t) => place(t).col === 'done').length;
    $('bar').style.width = (100 * done / TASKS.length).toFixed(1) + '%';
    $('count').textContent = done + ' / ' + TASKS.length + ' done';
    board.innerHTML = COLS.map((c) => {
      const list = TASKS.filter((t) => place(t).col === c.id && (!filter.phase || t.phase === filter.phase) && (!filter.you || t.you))
        .sort((a, b) => place(a).order - place(b).order);
      return '<section class="col" aria-label="' + c.name + '"><h2><span class="dot" style="background:' + c.color + '"></span>' + c.name +
        '<span class="n">' + list.length + '</span></h2><div class="list" data-col="' + c.id + '">' +
        (list.length ? list.map(cardHtml).join('') : '<div class="empty">Drop cards here</div>') + '</div></section>';
    }).join('');
    board.querySelectorAll('.list').forEach((l) => { l.scrollTop = keepScroll[l.dataset.col] || 0; });
  }
  function cardHtml(t) {
    const p = place(t);
    return '<article class="card' + (p.col === 'done' ? ' done' : '') + '" data-id="' + esc(t.id) + '" tabindex="0">' +
      '<div class="meta"><span class="tag" style="background:' + phaseColor(t.phase) + '">' + esc(t.phase) + '</span><span class="id">' + esc(t.id) + '</span>' +
      (t.you ? '<span class="you">Needs you</span>' : '') + '</div>' +
      '<div class="title">' + esc(t.title) + '</div>' +
      ((t.steps && t.steps.length) || p.note ? '<div class="sub">' + (t.steps && t.steps.length ? '<span>☰ ' + t.steps.length + (t.steps.length === 1 ? ' step' : ' steps') + '</span>' : '') + (p.note ? '<span>✎ note</span>' : '') + '</div>' : '') +
      '</article>';
  }
  function renderFilters() {
    $('filters').innerHTML = '<button class="chip' + (!filter.phase ? ' on' : '') + '" data-ph="">All</button>' +
      '<button class="chip youf' + (filter.you ? ' on' : '') + '" data-you="1">Needs you</button>' +
      phases.map((p) => '<button class="chip' + (filter.phase === p ? ' on' : '') + '" data-ph="' + esc(p) + '">' + esc(p) + '</button>').join('');
  }
  $('filters').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (b.dataset.you) filter.you = !filter.you; else filter.phase = b.dataset.ph || null;
    renderFilters(); render();
  });

  // ---- saving a move ----
  async function moveTask(id, col, order) {
    const prev = place(byId.get(id));
    if (prev.col === col && prev.order === order) return;
    const m = { col, order, t: Date.now(), note: (moves[id] && moves[id].note) || undefined };
    if (m.note === undefined) delete m.note;
    moves[id] = m;
    try { localStorage.setItem(LS, JSON.stringify(moves)); } catch (e) {}
    render();
    if (db) {
      try { await db.collection('moves').doc(id).set(m); }
      catch (e) { setSync('Not synced: ' + (e && e.code || 'error'), false); }
    }
  }
  // Order value for dropping between two cards (by their current order).
  function orderBetween(beforeId, afterId) {
    const a = beforeId ? place(byId.get(beforeId)).order : null, b = afterId ? place(byId.get(afterId)).order : null;
    if (a == null && b == null) return 10;
    if (a == null) return b - 10;
    if (b == null) return a + 10;
    return (a + b) / 2;
  }

  // ---- drag and drop (mouse: drag; touch: press and hold, then drag) ----
  let drag = null, press = null;
  const HOLD_MS = 260, SLOP = 8;
  document.addEventListener('contextmenu', (e) => { if (e.target.closest('.card')) e.preventDefault(); });
  $('board').addEventListener('pointerdown', (e) => {
    const card = e.target.closest('.card'); if (!card || e.button > 0) return;
    press = { card, x: e.clientX, y: e.clientY, id: e.pointerId, type: e.pointerType, timer: null };
    if (e.pointerType !== 'mouse') {
      card.classList.add('press');
      press.timer = setTimeout(() => { if (press) startDrag(press.x, press.y); }, HOLD_MS);
    }
  });
  document.addEventListener('pointermove', (e) => {
    if (drag) { moveDrag(e.clientX, e.clientY); e.preventDefault(); return; }
    if (!press) return;
    const far = Math.hypot(e.clientX - press.x, e.clientY - press.y) > SLOP;
    if (press.type === 'mouse') { if (far) startDrag(e.clientX, e.clientY); }
    else if (far) cancelPress(); // finger moved before the hold: it's a scroll
    else { press.x = e.clientX; press.y = e.clientY; }
  }, { passive: false });
  // Stop the page from scrolling while a card is being dragged with a finger.
  document.addEventListener('touchmove', (e) => { if (drag) e.preventDefault(); }, { passive: false });
  document.addEventListener('pointerup', (e) => {
    if (drag) { endDrag(); return; }
    cancelPress();
  });
  // A tap or click (not the end of a drag) opens the card. Using click avoids the tap "falling through" to the sheet's backdrop.
  let draggedAt = 0;
  $('board').addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (card && Date.now() - draggedAt > 350) openSheet(card.dataset.id);
  });
  document.addEventListener('pointercancel', () => { if (drag) endDrag(); else cancelPress(); });
  function cancelPress() { if (!press) return; clearTimeout(press.timer); press.card.classList.remove('press'); press = null; }

  function startDrag(x, y) {
    const card = press.card; clearTimeout(press.timer); card.classList.remove('press'); press = null;
    const r = card.getBoundingClientRect();
    const ghost = card.cloneNode(true); ghost.classList.add('ghost');
    ghost.style.width = r.width + 'px'; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
    document.body.appendChild(ghost);
    card.classList.add('ph');
    drag = { card, ghost, dx: x - r.left, dy: y - r.top, x, y, raf: 0 };
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
    autoScroll();
    moveDrag(x, y);
  }
  function listAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const col = el && el.closest('.col');
    return col ? col.querySelector('.list') : null;
  }
  function moveDrag(x, y) {
    drag.x = x; drag.y = y;
    drag.ghost.style.left = (x - drag.dx) + 'px'; drag.ghost.style.top = (y - drag.dy) + 'px';
    const list = listAt(x, y);
    document.querySelectorAll('.list.over').forEach((l) => l !== list && l.classList.remove('over'));
    if (!list) return;
    list.classList.add('over');
    const empty = list.querySelector('.empty'); if (empty) empty.remove();
    const cards = [...list.querySelectorAll('.card')].filter((c) => c !== drag.card);
    const before = cards.find((c) => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
    if (before) { if (drag.card.nextElementSibling !== before) list.insertBefore(drag.card, before); }
    else if (list.lastElementChild !== drag.card) list.appendChild(drag.card);
  }
  // Scroll the board sideways and the column up/down when dragging near an edge.
  function autoScroll() {
    if (!drag) return;
    const b = $('board'), E = 56, speed = (d) => Math.ceil(10 * (1 - Math.max(0, d) / E)); // faster the closer to the edge
    if (drag.x < E) b.scrollLeft -= speed(drag.x); else if (drag.x > innerWidth - E) b.scrollLeft += speed(innerWidth - drag.x);
    const list = listAt(drag.x, drag.y);
    if (list) { const r = list.getBoundingClientRect(); if (drag.y < r.top + E) list.scrollTop -= speed(drag.y - r.top); else if (drag.y > r.bottom - E) list.scrollTop += speed(r.bottom - drag.y); }
    if (b.style.scrollSnapType !== 'none') b.style.scrollSnapType = 'none';
    drag.raf = requestAnimationFrame(() => { moveDrag(drag.x, drag.y); autoScroll(); });
  }
  function endDrag() {
    const d = drag; drag = null; cancelAnimationFrame(d.raf); draggedAt = Date.now();
    d.ghost.remove(); d.card.classList.remove('ph');
    $('board').style.scrollSnapType = '';
    document.querySelectorAll('.list.over').forEach((l) => l.classList.remove('over'));
    const list = d.card.closest('.list');
    if (!list) { render(); return; }
    const prev = d.card.previousElementSibling, next = d.card.nextElementSibling;
    const id = d.card.dataset.id;
    moveTask(id, list.dataset.col, orderBetween(prev && prev.dataset.id, next && next.dataset.id));
  }

  // ---- details sheet ----
  function openSheet(id) {
    const t = byId.get(id); if (!t) return;
    const p = place(t);
    $('sheet').innerHTML = '<button class="close" aria-label="Close">✕</button>' +
      '<div class="meta"><span class="tag" style="background:' + phaseColor(t.phase) + '">' + esc(t.phase) + '</span> <span class="id">' + esc(t.id) + '</span>' +
      (t.you ? ' <span class="you">Needs you</span>' : '') + '</div>' +
      '<h3 id="sh-title">' + esc(t.title) + '</h3><p>' + esc(t.desc) + '</p>' +
      (t.steps && t.steps.length ? '<ul>' + t.steps.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ul>' : '') +
      (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') +
      '<div class="moves">' + COLS.map((c) => '<button data-col="' + c.id + '"' + (p.col === c.id ? ' class="cur"' : '') + '>' + c.name + '</button>').join('') + '</div>';
    $('sheet').dataset.id = id;
    $('sheet').classList.add('on'); $('sheet-bg').classList.add('on');
  }
  function closeSheet() { $('sheet').classList.remove('on'); $('sheet-bg').classList.remove('on'); }
  $('sheet-bg').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', (e) => {
    if (e.target.closest('.close')) return closeSheet();
    const b = e.target.closest('.moves button'); if (!b) return;
    const id = $('sheet').dataset.id, col = b.dataset.col;
    const last = TASKS.filter((t) => t.id !== id && place(t).col === col).reduce((m, t) => Math.max(m, place(t).order), 0);
    if (place(byId.get(id)).col !== col) moveTask(id, col, last + 10);
    closeSheet();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSheet();
    if (e.key === 'Enter' && document.activeElement && document.activeElement.classList.contains('card')) openSheet(document.activeElement.dataset.id);
  });

  // ---- shared store (when this page is published as an artifact with a database) ----
  function setSync(text, live) { const s = $('sync'); s.textContent = text; s.classList.toggle('live', !!live); }
  renderFilters(); render();
  if (window.claude && typeof window.claude.use === 'function') {
    setSync('Connecting…');
    const timer = setTimeout(() => setSync('Saved on this device'), 10000);
    window.claude.use('db').then((d) => {
      if (!d) { clearTimeout(timer); setSync('Saved on this device'); return; }
      db = d;
      db.collection('moves').onSnapshot((snap) => {
        if (!snap.metadata.fromCache) { clearTimeout(timer); setSync('Synced', true); }
        const shared = {};
        snap.docs.forEach((doc) => { const v = doc.data(); if (v && byId.has(doc.id)) shared[doc.id] = v; });
        // Shared moves win over this device's, unless this device moved the card later.
        for (const [id, v] of Object.entries(shared)) if (!moves[id] || (v.t || 0) >= (moves[id].t || 0)) moves[id] = v;
        try { localStorage.setItem(LS, JSON.stringify(moves)); } catch (e) {}
        if (!drag) render();
      }, (err) => { clearTimeout(timer); setSync('Saved on this device'); db = null; });
    }).catch(() => { clearTimeout(timer); setSync('Saved on this device'); });
  }
})();
</script>
</body>
</html>
